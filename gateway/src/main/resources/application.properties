spring.application.name=gateway
server.port=8080

spring.cloud.gateway.server.webmvc.trusted-proxies=.*
eureka.instance.lease-renewal-interval-in-seconds=${EUREKA_LEASE_RENEWAL_INTERVAL_SECONDS:5}
eureka.client.registry-fetch-interval-seconds=${EUREKA_REGISTRY_FETCH_INTERVAL_SECONDS:5}
spring.cloud.gateway.server.webmvc.routes[0].id=resourceModule
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://resource-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/resources/**
spring.cloud.gateway.server.webmvc.routes[1].id=songModule
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://song-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/songs/**
spring.cloud.gateway.server.webmvc.routes[2].id=storageModule
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://storage-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/storages/**
spring.cloud.gateway.server.webmvc.routes[3].id=authModule
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://auth-server
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/oauth2/**,/login,/login/**,/userinfo,/userinfo/**,/connect/**,/.well-known/**
spring.cloud.gateway.server.webmvc.routes[4].id=uiModule
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://ui-service
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/ui/**
eureka.client.serviceUrl.defaultZone=http://${EUREKA_HOSTNAME:localhost}:8761/eureka/
eureka.instance.preferIpAddress=${EUREKA_PREFER_IP_ADDRESS:false}
eureka.instance.instanceId=${spring.application.name}:${spring.application.instance_id:${random.value}}

spring.web.resources.add-mappings=false
spring.web.error.whitelabel.enabled=false
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never

spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

spring.cloud.config.fail-fast=false
management.endpoints.web.exposure.include=health,info,refresh,prometheus

management.tracing.sampling.probability=1.0
management.tracing.export.zipkin.endpoint=http://${ZIPKIN_HOST:localhost}:9411/api/v2/spans

logstash.host=${LOGSTASH_HOST:localhost}
logstash.port=${LOGSTASH_PORT:5000}

