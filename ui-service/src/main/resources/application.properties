server.port=8085
spring.application.name=ui-service

server.servlet.context-path=/ui

server.forward-headers-strategy=framework

spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
spring.cloud.config.fail-fast=false

eureka.instance.hostname=${EUREKA_HOSTNAME:localhost}
eureka.client.serviceUrl.defaultZone=http://${EUREKA_HOSTNAME:localhost}:8761/eureka/
eureka.instance.lease-renewal-interval-in-seconds=${EUREKA_LEASE_RENEWAL_INTERVAL_SECONDS:5}
eureka.client.registry-fetch-interval-seconds=${EUREKA_REGISTRY_FETCH_INTERVAL_SECONDS:5}
eureka.instance.preferIpAddress=${EUREKA_PREFER_IP_ADDRESS:false}
eureka.instance.instanceId=${spring.application.name}:${spring.application.instance_id:${random.value}}

spring.security.oauth2.client.registration.spotify-ui.provider=spotify-auth
spring.security.oauth2.client.registration.spotify-ui.client-id=ui-client
spring.security.oauth2.client.registration.spotify-ui.client-secret=ui-secret
spring.security.oauth2.client.registration.spotify-ui.client-name=Spotify Storage UI
spring.security.oauth2.client.registration.spotify-ui.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.spotify-ui.redirect-uri={baseUrl}/login/oauth2/code/spotify-ui
spring.security.oauth2.client.registration.spotify-ui.scope=openid,profile,storage:read,storage:write,storage:delete

spring.security.oauth2.client.provider.spotify-auth.authorization-uri=${AUTH_SERVER_AUTHORIZATION_URI:http://localhost:8080/oauth2/authorize}
spring.security.oauth2.client.provider.spotify-auth.token-uri=${AUTH_SERVER_TOKEN_URI:http://localhost:8080/oauth2/token}
spring.security.oauth2.client.provider.spotify-auth.jwk-set-uri=${AUTH_SERVER_JWK_SET_URI:http://localhost:8080/oauth2/jwks}
spring.security.oauth2.client.provider.spotify-auth.user-info-uri=${AUTH_SERVER_USERINFO_URI:http://localhost:8080/userinfo}
spring.security.oauth2.client.provider.spotify-auth.user-name-attribute=sub

server.servlet.session.cookie.name=UISESSIONID

storage.api.base-url=${STORAGE_API_URL:http://localhost:8080}

management.endpoints.web.exposure.include=health,info,refresh,prometheus
management.endpoint.health.show-details=always

management.tracing.sampling.probability=1.0
management.tracing.export.zipkin.endpoint=http://${ZIPKIN_HOST:localhost}:9411/api/v2/spans

logstash.host=${LOGSTASH_HOST:localhost}
logstash.port=${LOGSTASH_PORT:5000}
