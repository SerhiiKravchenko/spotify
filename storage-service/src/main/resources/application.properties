server.port=8074
spring.application.name=storage-service
spring.datasource.url=${STORAGE_DB_URL:jdbc:postgresql://localhost:5434/storage_db}
spring.datasource.username=${STORAGE_DB_USER:postgres}
spring.datasource.password=${STORAGE_DB_PASSWORD:postgres}
eureka.instance.lease-renewal-interval-in-seconds=${EUREKA_LEASE_RENEWAL_INTERVAL_SECONDS:5}
eureka.client.registry-fetch-interval-seconds=${EUREKA_REGISTRY_FETCH_INTERVAL_SECONDS:5}
eureka.instance.hostname=${EUREKA_HOSTNAME:localhost}
eureka.client.serviceUrl.defaultZone=http://${EUREKA_HOSTNAME:localhost}:8761/eureka/
eureka.instance.preferIpAddress=${EUREKA_PREFER_IP_ADDRESS:false}
eureka.instance.instanceId=${spring.application.name}:${spring.application.instance_id:${random.value}}
aws.s3.endpoint=${AWS_S3_ENDPOINT:http://localhost:4566}
aws.s3.region=${AWS_DEFAULT_REGION:us-east-1}
aws.s3.access-key=${AWS_ACCESS_KEY_ID:test}
aws.s3.secret-key=${AWS_SECRET_ACCESS_KEY:test}
storage.seed.staging-bucket=${STORAGE_STAGING_BUCKET:staging-bucket}
storage.seed.permanent-bucket=${STORAGE_PERMANENT_BUCKET:permanent-bucket}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_SERVER_ISSUER_URI:http://localhost:9000}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_SERVER_ISSUER_URI:http://localhost:9000}/oauth2/jwks

spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

spring.cloud.config.fail-fast=false
management.endpoints.web.exposure.include=health,info,refresh,prometheus

management.tracing.sampling.probability=1.0
management.tracing.export.zipkin.endpoint=http://${ZIPKIN_HOST:localhost}:9411/api/v2/spans

logstash.host=${LOGSTASH_HOST:localhost}
logstash.port=${LOGSTASH_PORT:5000}
