apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    uid: prometheus-uid
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: '15s'

  - name: Elasticsearch
    type: elasticsearch
    access: proxy
    uid: elasticsearch-uid
    url: http://elasticsearch:9200
    editable: false
    database: "app-logs-*"
    jsonData:
      esVersion: '8.0.0'
      timeField: '@timestamp'
      logLevelField: 'level'
      logMessageField: 'message'
