services:
  resource-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${RESOURCE_DB_NAME}
      POSTGRES_USER: ${RESOURCE_DB_USER}
      POSTGRES_PASSWORD: ${RESOURCE_DB_PASSWORD}
    ports:
      - "5432"
    volumes:
      - ./init-scripts/resource-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RESOURCE_DB_USER} -d ${RESOURCE_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  song-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${SONG_DB_NAME}
      POSTGRES_USER: ${SONG_DB_USER}
      POSTGRES_PASSWORD: ${SONG_DB_PASSWORD}
    ports:
      - "5433"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SONG_DB_USER} -d ${SONG_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  storage-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${STORAGE_DB_NAME}
      POSTGRES_USER: ${STORAGE_DB_USER}
      POSTGRES_PASSWORD: ${STORAGE_DB_PASSWORD}
    ports:
      - "5434"
    volumes:
      - ./init-scripts/storage-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${STORAGE_DB_USER} -d ${STORAGE_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "5672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  localstack:
    image: localstack/localstack:3.8.1
    ports:
      - "4566"
    environment:
      SERVICES: s3
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4566/_localstack/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    ports:
      - "9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.routing.allocation.disk.threshold_enabled=false
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qv '\"status\":\"red\"'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.0
    ports:
      - "5000"
    volumes:
      - ./observability/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./observability/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
    environment:
      LS_JAVA_OPTS: "-Xmx256m -Xms256m"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9600 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  zipkin:
    image: openzipkin/zipkin:3.4
    ports:
      - "9411"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:9411/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  eureka-server:
    build:
      context: ./eureka
      dockerfile: Dockerfile
    ports:
      - "8761"
    environment:
      EUREKA_HOSTNAME: ${EUREKA_HOSTNAME}
      EUREKA_PREFER_IP_ADDRESS: ${EUREKA_PREFER_IP_ADDRESS}
      LOGSTASH_HOST: ${LOGSTASH_HOST}
      ZIPKIN_HOST: ${ZIPKIN_HOST}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      logstash:
        condition: service_started
      zipkin:
        condition: service_started

  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile
    ports:
      - "8888"
    environment:
      EUREKA_HOSTNAME: ${EUREKA_HOSTNAME}
      EUREKA_PREFER_IP_ADDRESS: ${EUREKA_PREFER_IP_ADDRESS}
      EUREKA_LEASE_RENEWAL_INTERVAL_SECONDS: ${EUREKA_LEASE_RENEWAL_INTERVAL_SECONDS}
      EUREKA_REGISTRY_FETCH_INTERVAL_SECONDS: ${EUREKA_REGISTRY_FETCH_INTERVAL_SECONDS}
      CONFIG_REPO_URI: ${CONFIG_REPO_URI:?}
      CONFIG_REPO_BRANCH: ${CONFIG_REPO_BRANCH}
      LOGSTASH_HOST: ${LOGSTASH_HOST}
      ZIPKIN_HOST: ${ZIPKIN_HOST}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      eureka-server:
        condition: service_healthy
      logstash:
        condition: service_started
      zipkin:
        condition: service_started

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "8080"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_HOSTNAME: ${EUREKA_HOSTNAME}
      EUREKA_LEASE_RENEWAL_INTERVAL_SECONDS: ${EUREKA_LEASE_RENEWAL_INTERVAL_SECONDS}
      EUREKA_REGISTRY_FETCH_INTERVAL_SECONDS: ${EUREKA_REGISTRY_FETCH_INTERVAL_SECONDS}
      EUREKA_PREFER_IP_ADDRESS: ${EUREKA_PREFER_IP_ADDRESS}
      LOGSTASH_HOST: ${LOGSTASH_HOST}
      ZIPKIN_HOST: ${ZIPKIN_HOST}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      logstash:
        condition: service_started
      zipkin:
        condition: service_started

  resource-service:
    build:
      context: ./resource-service
      dockerfile: Dockerfile
    ports:
      - "8071"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_HOSTNAME: ${EUREKA_HOSTNAME}
      SPRING_DATASOURCE_URL: jdbc:postgresql://resource-db:5432/${RESOURCE_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${RESOURCE_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${RESOURCE_DB_PASSWORD}
      SONG_SERVICE_URL: http://song-service:8072/songs
      STORAGE_SERVICE_URL: http://storage-service:8074/storages
      EUREKA_PREFER_IP_ADDRESS: ${EUREKA_PREFER_IP_ADDRESS}
      APP_SECURITY_ENABLED: "false"
      AWS_S3_ENDPOINT: http://localstack:4566
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      LOGSTASH_HOST: ${LOGSTASH_HOST}
      ZIPKIN_HOST: ${ZIPKIN_HOST}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8071/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      resource-db:
        condition: service_healthy
      song-service:
        condition: service_healthy
      storage-service:
        condition: service_healthy
      localstack:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      logstash:
        condition: service_started
      zipkin:
        condition: service_started

  resource-processor:
    build:
      context: ./resource-processor
      dockerfile: Dockerfile
    ports:
      - "8090"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_HOSTNAME: ${EUREKA_HOSTNAME}
      EUREKA_PREFER_IP_ADDRESS: ${EUREKA_PREFER_IP_ADDRESS}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RESOURCE_SERVICE_URL: http://resource-service:8071/resources
      SONG_SERVICE_URL: http://song-service:8072/songs
      LOGSTASH_HOST: ${LOGSTASH_HOST}
      ZIPKIN_HOST: ${ZIPKIN_HOST}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      resource-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      logstash:
        condition: service_started
      zipkin:
        condition: service_started

  song-service:
    build:
      context: ./song-service
      dockerfile: Dockerfile
    ports:
      - "8072"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_HOSTNAME: ${EUREKA_HOSTNAME}
      EUREKA_PREFER_IP_ADDRESS: ${EUREKA_PREFER_IP_ADDRESS}
      SPRING_DATASOURCE_URL: jdbc:postgresql://song-db:5432/${SONG_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${SONG_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${SONG_DB_PASSWORD}
      APP_SECURITY_ENABLED: "false"
      LOGSTASH_HOST: ${LOGSTASH_HOST}
      ZIPKIN_HOST: ${ZIPKIN_HOST}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8072/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      song-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      logstash:
        condition: service_started
      zipkin:
        condition: service_started

  storage-service:
    build:
      context: ./storage-service
      dockerfile: Dockerfile
    ports:
      - "8074"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_HOSTNAME: ${EUREKA_HOSTNAME}
      EUREKA_PREFER_IP_ADDRESS: ${EUREKA_PREFER_IP_ADDRESS}
      SPRING_DATASOURCE_URL: jdbc:postgresql://storage-db:5432/${STORAGE_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${STORAGE_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${STORAGE_DB_PASSWORD}
      APP_SECURITY_ENABLED: "false"
      AWS_S3_ENDPOINT: http://localstack:4566
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      LOGSTASH_HOST: ${LOGSTASH_HOST}
      ZIPKIN_HOST: ${ZIPKIN_HOST}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8074/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      storage-db:
        condition: service_healthy
      localstack:
        condition: service_healthy
      logstash:
        condition: service_started
      zipkin:
        condition: service_started
