spring.application.name=config-server
server.port=8888

spring.cloud.config.server.git.uri=${CONFIG_REPO_URI:https://github.com/SerhiiKravchenko/spotify-config.git}
spring.cloud.config.server.git.default-label=${CONFIG_REPO_BRANCH:main}
spring.cloud.config.server.git.clone-on-start=true
spring.cloud.config.server.git.timeout=10
spring.cloud.config.server.git.refresh-rate=0
spring.cloud.config.server.git.force-pull=true
spring.cloud.config.server.git.resolve-placeholders=false

spring.cloud.config.enabled=false

eureka.instance.hostname=${EUREKA_HOSTNAME:localhost}
eureka.client.serviceUrl.defaultZone=http://${EUREKA_HOSTNAME:localhost}:8761/eureka/
eureka.instance.lease-renewal-interval-in-seconds=${EUREKA_LEASE_RENEWAL_INTERVAL_SECONDS:5}
eureka.client.registry-fetch-interval-seconds=${EUREKA_REGISTRY_FETCH_INTERVAL_SECONDS:5}
eureka.instance.preferIpAddress=${EUREKA_PREFER_IP_ADDRESS:false}
eureka.instance.instanceId=${spring.application.name}:${spring.application.instance_id:${random.value}}

management.endpoints.web.exposure.include=health,info,env,refresh,prometheus
management.endpoint.health.show-details=always

management.tracing.sampling.probability=1.0
management.tracing.export.zipkin.endpoint=http://${ZIPKIN_HOST:localhost}:9411/api/v2/spans

logstash.host=${LOGSTASH_HOST:localhost}
logstash.port=${LOGSTASH_PORT:5000}

management.endpoint.prometheus.enabled=true