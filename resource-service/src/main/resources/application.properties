server.port=8071
spring.application.name=resource-service
spring.datasource.url=${RESOURCE_DB_URL:jdbc:postgresql://localhost:5432/resource_db}
spring.datasource.username=${RESOURCE_DB_USER:postgres}
spring.datasource.password=${RESOURCE_DB_PASSWORD:postgres}
song-service.api.url=${SONG_SERVICE_URL:http://localhost:8072/songs}
storage-service.api.url=${STORAGE_SERVICE_URL:http://localhost:8074/storages}
eureka.instance.lease-renewal-interval-in-seconds=${EUREKA_LEASE_RENEWAL_INTERVAL_SECONDS:5}
eureka.client.registry-fetch-interval-seconds=${EUREKA_REGISTRY_FETCH_INTERVAL_SECONDS:5}
eureka.instance.hostname=${EUREKA_HOSTNAME:localhost}
eureka.client.serviceUrl.defaultZone=http://${EUREKA_HOSTNAME:localhost}:8761/eureka/
eureka.instance.preferIpAddress=${EUREKA_PREFER_IP_ADDRESS:false}
eureka.instance.instanceId=${spring.application.name}:${spring.application.instance_id:${random.value}}
aws.s3.endpoint=${AWS_S3_ENDPOINT:http://localhost:4566}
aws.s3.region=${AWS_DEFAULT_REGION:us-east-1}
aws.s3.access-key=${AWS_ACCESS_KEY_ID:test}
aws.s3.secret-key=${AWS_SECRET_ACCESS_KEY:test}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
rabbitmq.exchange=resource.exchange
rabbitmq.queue=resource.queue
rabbitmq.routing-key=resource.uploaded
rabbitmq.processed-queue=resource.processed.queue
rabbitmq.processed-routing-key=resource.processed

spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

spring.cloud.config.fail-fast=false
management.endpoints.web.exposure.include=health,info,refresh,prometheus,circuitbreakers
management.health.circuitbreakers.enabled=true

management.tracing.sampling.probability=1.0
management.tracing.export.zipkin.endpoint=http://${ZIPKIN_HOST:localhost}:9411/api/v2/spans

spring.rabbitmq.template.observation-enabled=true
spring.rabbitmq.listener.simple.observation-enabled=true

logstash.host=${LOGSTASH_HOST:localhost}
logstash.port=${LOGSTASH_PORT:5000}

resilience4j.circuitbreaker.instances.storageService.register-health-indicator=true
resilience4j.circuitbreaker.instances.storageService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.storageService.sliding-window-size=10
resilience4j.circuitbreaker.instances.storageService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.storageService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.storageService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.storageService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.storageService.automatic-transition-from-open-to-half-open-enabled=true
